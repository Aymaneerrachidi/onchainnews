name: Onchain Rundown

on:
  workflow_dispatch:
    inputs:
      job:
        description: daily, pulse, or both
        required: true
        default: both
        type: choice
        options:
          - both
          - daily
          - pulse
  schedule:
    # Europe/Paris morning during summer time. GitHub cron is UTC.
    - cron: "45 4 * * *"
    # Sustained-runner pulse.
    - cron: "11 * * * *"

permissions:
  contents: write

concurrency:
  group: onchain-rundown
  cancel-in-progress: false

env:
  HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
  BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
  X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
  X_USER_ACCESS_TOKEN: ${{ secrets.X_USER_ACCESS_TOKEN }}
  X_API_KEY: ${{ secrets.X_API_KEY }}
  X_API_SECRET: ${{ secrets.X_API_SECRET }}
  X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
  X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2' }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

jobs:
  daily:
    if: github.event_name == 'workflow_dispatch' && (inputs.job == 'daily' || inputs.job == 'both') || github.event.schedule == '45 4 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - uses: actions/cache/restore@v4
        with:
          path: data
          key: brief-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            brief-db-${{ runner.os }}-

      - run: uv run solana-brief run

      - name: Commit public report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/latest.json
          if git diff --cached --quiet; then
            echo "No public snapshot change."
          else
            git commit -m "Daily brief $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: brief-db-${{ runner.os }}-${{ github.run_id }}

      - name: Notify failure
        if: failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=ONCHAIN RUNDOWN FAILED: daily job ${GITHUB_RUN_ID}"

  pulse:
    if: github.event_name == 'workflow_dispatch' && (inputs.job == 'pulse' || inputs.job == 'both') || github.event.schedule == '11 * * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - uses: actions/cache/restore@v4
        with:
          path: data
          key: brief-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            brief-db-${{ runner.os }}-

      - run: uv run solana-brief pulse

      - name: Commit pulse state and live snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/latest.json web/data/pulse-state.json
          if git diff --cached --quiet; then
            echo "No pulse state change."
          else
            git commit -m "Hourly pulse $(date -u +%F-%H)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: brief-db-${{ runner.os }}-${{ github.run_id }}

      - name: Notify failure
        if: failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=ONCHAIN RUNDOWN FAILED: pulse job ${GITHUB_RUN_ID}"

name: Onchain Rundown

on:
  workflow_dispatch:
    inputs:
      job:
        description: daily, pulse, or both
        required: true
        default: both
        type: choice
        options:
          - both
          - daily
          - pulse
  schedule:
    # Europe/Paris morning during summer time. GitHub cron is UTC.
    - cron: "45 4 * * *"
    # The hourly pulse is intentionally manual-only during production testing.

permissions:
  contents: write

concurrency:
  group: onchain-rundown
  cancel-in-progress: false

env:
  GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
  HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
  BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
  DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
  DISCORD_CHANNEL_ID_SECONDARY: ${{ secrets.DISCORD_CHANNEL_ID_SECONDARY }}
  TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}

jobs:
  daily:
    if: github.event_name == 'workflow_dispatch' && (inputs.job == 'daily' || inputs.job == 'both') || github.event.schedule == '45 4 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install official GMGN CLI
        run: npm install --global gmgn-cli@1.5.8

      - uses: actions/cache/restore@v4
        with:
          path: data
          key: brief-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            brief-db-${{ runner.os }}-

      - run: uv run solana-brief run --no-discord

      - name: Audit every monitored X account across the complete 24-hour window
        if: env.TWITTERAPI_IO_KEY != ''
        run: >-
          uv run python scripts/check_x_existing.py
          --hours 24
          --strategy both
          --timeline-pages 100
          --merge-snapshot

      - name: Warn when the full X audit is unavailable
        if: env.TWITTERAPI_IO_KEY == ''
        run: echo "TWITTERAPI_IO_KEY is not configured; publishing the normal lore-only recap."

      # Commit only after X has enriched the snapshot used by every filter.
      - name: Commit public report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/latest.json
          if git diff --cached --quiet; then
            echo "No public snapshot change."
          else
            git commit -m "Daily brief $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Post interactive Discord recap
        if: env.DISCORD_BOT_TOKEN != '' && env.DISCORD_CHANNEL_ID != ''
        run: uv run python scripts/send_live_discord_recap.py --editorial-only

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: brief-db-${{ runner.os }}-${{ github.run_id }}

      - name: Notify failure
        if: failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=ONCHAIN RUNDOWN FAILED: daily job ${GITHUB_RUN_ID}"

  pulse:
    if: github.event_name == 'workflow_dispatch' && (inputs.job == 'pulse' || inputs.job == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install official GMGN CLI
        run: npm install --global gmgn-cli@1.5.8

      - uses: actions/cache/restore@v4
        with:
          path: data
          key: brief-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            brief-db-${{ runner.os }}-

      - run: uv run solana-brief pulse

      - name: Commit pulse state and live snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/latest.json web/data/pulse-state.json
          if git diff --cached --quiet; then
            echo "No pulse state change."
          else
            git commit -m "Hourly pulse $(date -u +%F-%H)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: brief-db-${{ runner.os }}-${{ github.run_id }}

      - name: Notify failure
        if: failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=ONCHAIN RUNDOWN FAILED: pulse job ${GITHUB_RUN_ID}"

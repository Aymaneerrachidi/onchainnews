[project]
name = "solana-daily-brief"
version = "0.1.0"
description = "A novelty-first daily Solana memecoin intelligence brief"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pillow>=10,<12",
  "rich>=13.7,<15",
  "websockets>=14,<16",
  "tzdata>=2025.2; platform_system == 'Windows'",
  # Pre-renders the QR each runner shows on stream. Generating these server
  # side with a proven encoder keeps a malformed code off the broadcast.
  "segno>=1.6,<2",
]

[project.scripts]
solana-brief = "brief.main:cli"

[dependency-groups]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brief"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

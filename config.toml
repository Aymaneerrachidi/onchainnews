# A name only reaches the recap on a real move. Below the floor it is not news.
[natives]
enabled = true
# A rally and a collapse are not the same size of event. 30% up on an
# established name is a real move; 30% down is an ordinary red day. A drop has
# to halve the coin before it carries the same weight.
min_gain_pct = 30.0
min_drop_pct = 50.0
# Below this the name is a survivor, not a major. A 60% day on a $4M coin is
# true and still not a story about the memes people actually hold.
min_market_cap = 10000000.0

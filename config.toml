# When true, only posts from the accounts above are quoted. Searched posts are
# still read as evidence for working out why a coin ran.
trusted_only = true
# 0 reads every account each run. A positive number reads that many and
# advances through the list on the next run, so a long list still gets
# covered without making any single run expensive.
accounts_per_run = 0
max_posts_per_account = 30
trusted_window_hours = 36

min_followers = 500
min_engagement = 3
# A post is judged on what it says. Chants and call-channel adverts score
# zero however many likes they have.
min_post_quality = 40
# Quote accounts the market actually watches. A holder with 2,000 followers
# praising their own bag is not news; smaller accounts still qualify on
# engagement alone, which is how a good post from nobody gets through.
min_account_followers = 3000
# The provider scores its own news. Below this the feed is price ticks.
min_news_score = 40
# The provider rate limits well below the monthly quota, and a failed query
# means that coin ships with no evidence. A short pause recovers half the board.
pause_seconds = 2.0

# Deep holder forensics for the editorial tracks. Expensive in Helius credits
# and not used by the daily journal, so it runs on a small watchlist.
[holders]
enabled = true
watchlist_limit = 1
snapshot_cache_seconds = 60
holder_page_limit = 1000
# The watchlist is deliberately small, so every selected token can be paginated
# to completion instead of silently treating the first 12,000 accounts as the
# full holder set. The source still fails closed if this defensive ceiling is
# ever reached.
max_holder_pages = 100
helius_requests_per_minute = 100
cluster_top_holders = 100
history_concurrency = 2
max_wallet_history_calls_per_run = 120
wallet_trace_cache_days = 30
acquisition_cache_days = 90
sniper_window_minutes = 10
fresh_wallet_hours = 24
daily_snapshot_min_age_hours = 20
weekly_snapshot_min_age_hours = 164
funding_cluster_window_minutes = 15
min_holder_change_pct = 2.0
flat_price_pct = 5.0
rising_price_pct = 15.0
min_concentration_change_pp = 1.0
cluster_alert_pp = 5.0
min_whale_delta_supply_pct = 0.5
min_retention_change_pct = 2.0
fresh_wallet_alert_pct = 50.0
# Daily runner vetting. This catches the CUPSINA/KERMIT/NENEM-style setup:
# nominal top10 looks low, but many top holders trace to one funding origin.
runner_cluster_check_enabled = true
runner_cluster_check_limit = 20
runner_cluster_top_holders = 24
runner_cluster_min_market_cap = 200000.0
runner_cluster_min_volume_24h = 250000.0
# Cluster tracing is a launch-structure check. Mature/high-holder movers still
# remain in the recap, but do not consume hundreds of Helius pages here; the
# one-token daily snapshot watchlist above continues to paginate in full.
runner_cluster_max_age_hours = 48.0
runner_cluster_max_holder_count = 30000
runner_cluster_max_history_calls = 420
same_funder_cluster_min_wallets = 6
same_funder_cluster_min_supply_pct = 2.0
same_funder_cluster_window_minutes = 240
fresh_wallet_pack_min_wallets = 8
fresh_wallet_pack_min_supply_pct = 3.0
excluded_accounts = []
excluded_owners = []
known_cex_wallets = []

[intelligence]
lp_removal_alert_pct = 10.0
lp_add_report_pct = 10.0
creator_outflow_alert_pp = 0.25
creator_sustained_days = 2
anomaly_zscore = 3.0
anomaly_trailing_days = 30
anomaly_min_samples = 7
min_social_account_age_days = 3.0
smart_money_winner_return_pct = 100.0
smart_money_min_prior_wins = 2
smart_money_alert_wallets = 3
early_holder_hours = 3.0
holder_overlap_alert_pct = 20.0
dex_dominance_pct = 80.0
jupiter_price_impact_pct = 5.0
jupiter_binary_search_steps = 14
retired_reappearance_multiple = 1.5
watcher_interval_seconds = 3600
watcher_pair_ttl_seconds = 30
watcher_rug_ttl_seconds = 900
watcher_holder_cache_seconds = 30
watcher_cluster_sell_pct = 5.0
watcher_creator_outflow_pp = 0.1

[pulse]
# Hourly market pulse. A runner alerts on its first qualifying appearance. Its
# pass stays in memory for the complete trailing-day recap, while the cooldown
# prevents the same mint from generating another hourly email the next hour.
window_hours = 24.0
required_passes = 1
repost_after_hours = 24.0
min_gap_minutes = 45.0
# Zero means every new runner in the hour is delivered in the same alert.
max_posts_per_run = 0
state_path = "web/data/pulse-state.json"
image_dir = "output/pulse-images"
image_template_path = "overlays/fomo-runner-template.jpg"
openai_image_enabled = false
openai_image_model = "gpt-image-2"
openai_image_size = "1024x1536"
openai_image_quality = "medium"
openai_image_format = "png"
openai_image_timeout_seconds = 120.0
write_latest_json = true
telegram_enabled = true
# Email is event-driven: an empty hourly scan sends nothing. One qualifying
# scan alerts immediately, and `repost_after_hours` suppresses duplicates.
email_enabled = true
x_post_enabled = false
x_timeout_seconds = 30.0
# The hourly pulse is meant to be cheap. The daily report still performs holder
# snapshots and tracked-wallet flow unless those sections are disabled above.
solana_only = false
max_ranked_tokens = 600
disable_helius_enrichment = false
disable_holder_snapshots = true
disable_kol_scan = true
disable_x_scan = true
capture_target = 12
capture_min_runner_score = 15.0
capture_min_organic_score = 25.0
capture_max_manipulation = 65.0

[lore]
# Why each coin ran, found on the open web rather than guessed. DuckDuckGo Lite
# rendered through Jina Reader needs no key and no account; Dexscreener
# publishes each project's own description free. Queries run most-specific
# first (contract address, then descriptive name, then ticker) and every result
# must pass a relevance score, because tickers are reused constantly and the
# wrong coin's story is worse than none.
enabled = true
max_coins = 15
queries_per_coin = 3
# 8 = contract address matched, 5 = full name or the project's own domain,
# 3 = ticker only. Below this a result is discarded rather than published.
min_score = 5
concurrency = 2
pause_seconds = 1.5
timeout_seconds = 45

[newsletter]
# The recap grouped and phrased by a model. Facts come only from the day's own
# evidence; the prompt forbids inventing news, posts, people or reasons, and
# any coin the model names that we did not hand it is dropped before sending.
# If this is off or the call fails, the deterministic template renders instead.
enabled = false
# Who writes the recap. Research still runs on OpenAI: Cohere removed its
# web-search connector in September 2025, so it can phrase the day but cannot
# go and find out what happened.
# Tried in this order: the one named here, then the other if it has a key.
# OpenAI writes markedly better prose; Cohere is the floor when credits run out.
provider = "openai"
# command-a-plus-05-2026 returns INVALID_TOOL_GENERATION on a full day's board
# in JSON mode (bisected: a field in the first rows, not the CJK tickers). The
# older model takes the same payload, every field included, without complaint.
cohere_model = "command-a-03-2025"
model = "gpt-5.5"
# Zero publishes every verified runner. The model must place each one exactly
# once, and the deterministic "Also ran" backfill catches anything it omits.
max_coins = 0
timeout_seconds = 120
# Before writing, search the web for what each of the day's biggest coins
# actually is and why it moved: the viral clip, the listing, the account that
# posted. Findings are cited; anything not found stays absent rather than
# being guessed at.
# Reprice the recap coins immediately before writing; a long run leaves the
# opening numbers badly stale.
refresh_before_write = false
research_enabled = false
explain_enabled = false
research_model = "gpt-5.5"
research_limit = 12
research_concurrency = 2
research_timeout_seconds = 180

[goplus]
# Free contract security for the EVM chains. No key, so the only limit worth
# respecting is the request rate.
requests_per_minute = 30
# Verify the likely public runners first. GMGN organic/KOL evidence controls
# priority; spending the free tier on hundreds of raw discovery rows delays the
# report without improving the shortlist.
max_tokens_per_chain = 20


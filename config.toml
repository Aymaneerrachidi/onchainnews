# Stream overlay. `trade_url_template` is what the on-screen QR opens, so a
# viewer can scan it and land on the coin instead of copying a contract address
# off a video. Placeholders: {chain}, {mint}, {symbol}. Replace this with the client's
# own referral link once he sends one share link from the app.
[overlay]
enabled = true
trade_url_template = "https://fomo.family/tokens/{chain}/{mint}"
# Appended to the deep link when set, e.g. "?ref=CODE" or "&ref=CODE".
trade_url_suffix = ""

# The established memes. These never appear in a discovery sweep — GMGN's
# trending ranks fresh activity, and a name the audience already holds is not
# fresh — so they are watched by contract address instead. Every address below
# was resolved through GMGN and confirmed by symbol and holder count before it
# was written down; a ticker search is not safe here, because searching "CATE"
# returns a spoof carrying a right-to-left override in its name.

[run]
timezone = "Europe/Paris"
top_tokens = 10
database_path = "data/brief.db"
html_path = "output/latest.html"
# Structured snapshot the hosted site renders.
json_path = "web/data/latest.json"
request_timeout_seconds = 15.0
log_level = "INFO"
# Raw HTTP bodies are compressed on write and kept only long enough to replay
# recent dates. Older rows are deleted on every committed run; run
# `solana-brief prune --vacuum` to compress old rows and reclaim the file.
archive_retention_days = 7
archive_compress = true
# fixture_path = "tests/fixtures/run.json" # Uncomment for deterministic offline runs.

[thresholds]
# Daily meme tape across the four established GMGN/Dexscreener markets. Each
# chain uses its own contract-safety adapter; Solana additionally gets Helius
# holder forensics.
chains = ["solana", "base", "bsc", "ethereum"]
min_market_cap = 200000.0
min_liquidity = 20000.0
# Strength has to show up in the tape. Without these two floors a thin float
# prices a handful of buys into a large notional cap and reaches the shortlist
# on no real trading at all.
min_volume_24h = 25000.0
min_turnover_24h = 0.15
# Wash-trading proxy for pairs under 24h old.
max_volume_liquidity_ratio = 25.0
# The same ratio on an established name; a violent day legitimately turns a
# pool over many times, and the launch limit rejected the strongest movers.
max_volume_liquidity_ratio_established = 75.0
max_top10_pct = 30.0
novelty_days = 7
follow_up_multiple = 3.0
retire_after_features = 3
max_pair_idle_hours = 6

[ranking]
cto_bonus = 1.0
profile_bonus = 0.25
boost_without_growth_penalty = 1.0

[editorial]
min_strength_signals = 3
min_interest_signals = 2
max_shortlist = 5
recycled_symbol_lookback_days = 30

# The movers track answers "strongest coins of the day" for names that already
# exist. It is deliberately independent of the 24h launch window; a token that
# launched last week and is running this morning belongs in the brief.
[movers]
enabled = true
max_movers = 5
min_strength_signals = 2
min_price_change_24h = 25.0
min_turnover = 0.5
min_volume_24h = 100000.0
# Kept in step with the journal's ceiling: no old coins anywhere in the report.
max_age_days = 1.5

# Community takeovers are old tokens by definition, so this track is also
# evaluated outside the launch window and is gated on post-claim vitality.
[cto]
enabled = true
max_ctos = 3
max_claim_age_days = 7
min_strength_signals = 2

# Ranked discovery across the whole Solana universe. Dexscreener's public feeds
# only surface trending metas, takeovers, profiles and boosts â€” about four
# hundred tokens â€” which is too narrow to answer "what is strongest today".
# Requires BIRDEYE_API_KEY; without it discovery falls back to Dexscreener.
[birdeye]
enabled = true
# GMGN is the wide runner backbone. Birdeye is a secondary volume cross-check,
# so its free quota is reserved for the top tape rather than duplicating 600
# rows per chain before the safety stage.
max_tokens = 200
page_size = 50
requests_per_minute = 50
# The free tier allows roughly one request per second, and the per-minute
# limiter would otherwise let a burst through and earn a run of 429s.
request_interval_seconds = 1.1

# Superseded by Birdeye ranked discovery for finding runners. Leaving this on
# spends most of the Helius credit budget enriching mints that never traded.
[launch_index]
enabled = false
max_mints_enriched_per_run = 12000
pump_program = "6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P"

[cache]
pairs_ttl_seconds = 60
discovery_ttl_seconds = 600
safety_ttl_seconds = 3600
keyed_ttl_seconds = 900
openintel_ttl_seconds = 900

# GMGN is a read-only intelligence provider. The scanner never invokes swap,
# order, cooking, token launch, or private-key commands. Its free allowance is
# weighted, so CLI calls are cached, serialized, and stopped after the first
# rate-limit response instead of extending a temporary provider ban.
[gmgn]
enabled = true
kline_verification_enabled = true
# Hourly candles prove the actual trailing-day high for the most relevant
# KOL-backed names, including 24-30h launches and moves that faded before close.
kline_candidate_limit = 40
runner_trader_enrichment = true
runner_trader_limit = 25
runner_trader_rows = 20
timeout_seconds = 35
cache_ttl_seconds = 900
min_interval_seconds = 1.25

[openintel]
# OpenNews' free hot feed works without a token. OPENNEWS_TOKEN unlocks precise
# per-finalist news and OpenTwitter evidence searches.
enabled = true
finalist_limit = 25

# Deep holder forensics for the editorial tracks. Expensive in Helius credits
# and not used by the daily journal, so it runs on a small watchlist.
[holders]
enabled = true
watchlist_limit = 1
snapshot_cache_seconds = 60
holder_page_limit = 1000
# The watchlist is deliberately small, so every selected token can be paginated
# to completion instead of silently treating the first 12,000 accounts as the
# full holder set. The source still fails closed if this defensive ceiling is
# ever reached.
max_holder_pages = 100
helius_requests_per_minute = 100
cluster_top_holders = 100
history_concurrency = 2
max_wallet_history_calls_per_run = 120
wallet_trace_cache_days = 30
acquisition_cache_days = 90
sniper_window_minutes = 10
fresh_wallet_hours = 24
daily_snapshot_min_age_hours = 20
weekly_snapshot_min_age_hours = 164
funding_cluster_window_minutes = 15
min_holder_change_pct = 2.0
flat_price_pct = 5.0
rising_price_pct = 15.0
min_concentration_change_pp = 1.0
cluster_alert_pp = 5.0
min_whale_delta_supply_pct = 0.5
min_retention_change_pct = 2.0
fresh_wallet_alert_pct = 50.0
# Daily runner vetting. This catches the CUPSINA/KERMIT/NENEM-style setup:
# nominal top10 looks low, but many top holders trace to one funding origin.
runner_cluster_check_enabled = true
runner_cluster_check_limit = 20
runner_cluster_top_holders = 24
runner_cluster_min_market_cap = 200000.0
runner_cluster_min_volume_24h = 250000.0
# Cluster tracing is a launch-structure check. Mature/high-holder movers still
# remain in the recap, but do not consume hundreds of Helius pages here; the
# one-token daily snapshot watchlist above continues to paginate in full.
runner_cluster_max_age_hours = 48.0
runner_cluster_max_holder_count = 30000
runner_cluster_max_history_calls = 420
same_funder_cluster_min_wallets = 6
same_funder_cluster_min_supply_pct = 2.0
same_funder_cluster_window_minutes = 240
fresh_wallet_pack_min_wallets = 8
fresh_wallet_pack_min_supply_pct = 3.0
excluded_accounts = []
excluded_owners = []
known_cex_wallets = []

[intelligence]
lp_removal_alert_pct = 10.0
lp_add_report_pct = 10.0
creator_outflow_alert_pp = 0.25
creator_sustained_days = 2
anomaly_zscore = 3.0
anomaly_trailing_days = 30
anomaly_min_samples = 7
min_social_account_age_days = 3.0
smart_money_winner_return_pct = 100.0
smart_money_min_prior_wins = 2
smart_money_alert_wallets = 3
early_holder_hours = 3.0
holder_overlap_alert_pct = 20.0
dex_dominance_pct = 80.0
jupiter_price_impact_pct = 5.0
jupiter_binary_search_steps = 14
retired_reappearance_multiple = 1.5
watcher_interval_seconds = 3600
watcher_pair_ttl_seconds = 30
watcher_rug_ttl_seconds = 900
watcher_holder_cache_seconds = 30
watcher_cluster_sell_pct = 5.0
watcher_creator_outflow_pp = 0.1

[pulse]
# Hourly market pulse. A runner alerts on its first qualifying appearance. Its
# pass stays in memory for the complete trailing-day recap, while the cooldown
# prevents the same mint from generating another hourly email the next hour.
window_hours = 24.0
required_passes = 1
repost_after_hours = 24.0
min_gap_minutes = 45.0
# Zero means every new runner in the hour is delivered in the same alert.
max_posts_per_run = 0
state_path = "web/data/pulse-state.json"
image_dir = "output/pulse-images"
image_template_path = "overlays/fomo-runner-template.jpg"
openai_image_enabled = false
openai_image_model = "gpt-image-2"
openai_image_size = "1024x1536"
openai_image_quality = "medium"
openai_image_format = "png"
openai_image_timeout_seconds = 120.0
write_latest_json = true
telegram_enabled = true
# Email is event-driven: an empty hourly scan sends nothing. One qualifying
# scan alerts immediately, and `repost_after_hours` suppresses duplicates.
email_enabled = true
x_post_enabled = false
x_timeout_seconds = 30.0
# The hourly pulse is meant to be cheap. The daily report still performs holder
# snapshots and tracked-wallet flow unless those sections are disabled above.
solana_only = false
max_ranked_tokens = 600
disable_helius_enrichment = true
disable_holder_snapshots = true
disable_kol_scan = true
disable_x_scan = true
capture_target = 12
capture_min_runner_score = 15.0
capture_min_organic_score = 25.0
capture_max_manipulation = 65.0

[goplus]
# Free contract security for the EVM chains. No key, so the only limit worth
# respecting is the request rate.
requests_per_minute = 30
# Verify the likely public runners first. GMGN organic/KOL evidence controls
# priority; spending the free tier on hundreds of raw discovery rows delays the
# report without improving the shortlist.
max_tokens_per_chain = 20

[sources]
dexscreener_base_url = "https://api.dexscreener.com"
birdeye_base_url = "https://public-api.birdeye.so"
goplus_base_url = "https://api.gopluslabs.io"
rugcheck_base_url = "https://api.rugcheck.xyz/v1"
helius_base_url = "https://mainnet.helius-rpc.com"
jupiter_quote_url = "https://lite-api.jup.ag/swap/v1/quote"
jupiter_price_url = "https://lite-api.jup.ag/price/v3"
geckoterminal_base_url = "https://api.geckoterminal.com/api/v2"
x_public_metadata_url = "https://cdn.syndication.twimg.com/widgets/followbutton/info.json"
x_recent_search_url = "https://api.x.com/2/tweets/search/recent"
openintel_base_url = "https://ai.6551.io"

# Public X posts from this bounded desk list become source-linked catalyst
# evidence. Likes are not treated as observable interactions; posts, replies,
# quotes and reposts are. Replace or extend this starter list for the client.
[x]
enabled = true
accounts_per_query = 20
max_pages_per_query = 5
requests_per_minute = 60
max_matches_per_token = 6
accounts = [
  "cobie",
  "blknoiz06",
  "elonmusk",
  "solana",
  "pumpdotfun",
  "aeyakovenko",
  "weremeow",
  "JupiterExchange",
]

# Stream overlay. `trade_url_template` is what the on-screen QR opens, so a
# viewer can scan it and land on the coin instead of copying a contract address
# off a video. Placeholders: {mint}, {symbol}. Replace this with the client's
# own referral link once he sends one share link from the app.
[overlay]
enabled = true
trade_url_template = "https://fomo.family/token/{mint}"
# Appended to the deep link when set, e.g. "?ref=CODE" or "&ref=CODE".
trade_url_suffix = ""

[delivery]
# Requires TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in .env.
# A missing credential warns and skips; it never fails the run.
telegram_enabled = true
html_enabled = true
# Morning message: the picks and one line each, not the full report.
telegram_digest = true
# Optional link appended to the digest so the full report is one tap away.
report_url = "https://onchainnews-rho.vercel.app"

# Optional email delivery. Use Brevo for API-based free delivery to external
# recipients without SMTP. Set BREVO_API_KEY in .env/GitHub secrets.
email_enabled = true
email_provider = "brevo"
email_from = "ue06prog@gmail.com"
email_from_name = "Fomo Onchain"
email_to = [
  "ue06prog@gmail.com",
]
email_subject_prefix = "Fomo Onchain"
# Newsletter recap breadth. Clean runners always appear. These settings add
# strong observed movers that did not clear the strict organic publisher gate,
# with their caveats shown inline, so the email reads like a real market recap.
newsletter_observed_limit = 25
newsletter_min_observed_runner_score = 25.0
newsletter_max_observed_manipulation = 70.0
newsletter_min_observed_volume = 250000.0
newsletter_min_observed_market_cap = 200000.0
newsletter_excluded_risk_terms = [
  "rugcheck has already marked",
  "rugged",
  "scam",
  "honeypot",
  "mint authority still live",
  "freeze authority still live",
  "liquidity neither locked nor burned",
  "bundled supply",
  "same-funder holder cluster",
  "fresh-wallet holder pack",
  "effective top10 after clustering",
  "manufactured tape",
  "blacklist",
  "selling is penalised",
  "recycled ticker/name",
  "move on only 0.",
  "move with no linked social context",
  "tracked-wallet confirmation was too thin",
  "no tracked kol wallet traded",
  "tracked kol wallet scan unavailable",
]

# The daily journal: what ran today. Deliberately wider than the editorial
# tracks. A coin enters through one of two doors -- created inside the fresh
# window and up by min_fresh_change_pct, or any age doing old_coin_multiple.
# Safety problems become labels on the row; only the rug/bundle conditions
# below remove a coin from the record entirely.
[journal]
enabled = true
# Human-confirmed bad mints never re-enter through the live screen, KOL lane,
# caveated fill, or saved intraday pulse history.
excluded_mints = [
  "n8MQ3kqhTjyiw4FCJ6kr93auxaBBZ43TkJMNKNnpump", # TNOS
  "DGX9HZznvcyiBAyVCPKZuof3Qb7XayvWgMMJbJJhpump", # KERMIT
]
max_runners = 0
# Never manufacture a daily quota. Publish every organic runner that clears the
# evidence gate; a quiet day may contain fewer names and a busy day may contain
# many more.
target_min_runners = 0
include_intraday_pulse_runners = true
# The recap is the ledger of hourly alerts: include every pulse runner that was
# actually claimed for delivery in the preceding 24 hours, even if it faded or
# the deeper morning KOL scan did not rediscover it. New hard-risk evidence can
# still remove it.
pulse_recap_alerted_only = true
include_all_alerted_pulse_runners = true
intraday_min_peak_market_cap = 200000.0
intraday_min_volume_24h = 250000.0
intraday_min_liquidity = 40000.0
intraday_min_trades_24h = 1000
intraday_min_runner_score = 25.0
intraday_max_manipulation = 55.0
min_volume_24h = 250000.0
min_liquidity = 40000.0
# Peak-led recap: an established token may belong if it made a measured move in
# this 24h window. GMGN lifetime ATH is only trusted for <=24h-old launches.
max_age_hours = 0
peak_market_cap_floor = 250000.0
min_window_multiple = 1.50
# Launch discovery extends to 30h so the morning cutoff does not lose coins born
# just before yesterday's 24h window. GMGN candles still prove that their peak
# happened inside the trailing day.
fresh_window_hours = 30
min_fresh_change_pct = 30.0
older_than_a_day_multiple = 0.0
min_daily_change_pct = 50.0
new_ath_tolerance_pct = 2.0
min_new_ath_move_pct = 10.0
# Above this multiple, expect at least one tracked wallet to have been in it.
# Measured on live data, 66 wallets touch only about one runner in seven, so
# silence is the norm and flagging it at 5x accused nearly every coin. Set where
# absence is genuinely odd, and reported on the row rather than treated as proof.
# Lower this as more wallets are added and coverage improves.
expect_tracked_wallets_above = 10.0
# Tracked wallets are confirmation, not a hard gate. A real organic runner can
# be missed by our wallet set; absence should be reported/weighted, not used to
# zero the newsletter.
require_wallet_touch_for_publish = false
require_kol_trade_for_publish = true
min_kol_trades_for_publish = 1
gate_editorial_tracks = true
wallet_touch_required_above_multiple = 1.8
wallet_touch_required_min_mcap = 200000.0
wallet_touch_required_min_buyers = 2
wallet_touch_required_min_participants = 3
wallet_touch_required_min_realised_sol = 50.0
# A feed sometimes reports a nonsense 24h change when a pool is reseeded. Such
# a number tops every ranking, so a big run must be corroborated by turnover.
max_credible_multiple = 1000.0
corroborate_above_multiple = 10.0
min_turnover_for_big_run = 0.15

# Organic-market gate. A coin can be perfectly safe to hold and still be a bot
# trading with itself, a bought trend slot, or the ninth mint wearing a ticker
# that worked once. These remove it from the record rather than label it.
max_volume_liquidity = 75.0       # 24h volume against pool depth
max_turnover = 30.0               # 24h volume against market cap
# Cadence was measured against a coin the client confirmed was normal: it ran
# 219 trades a minute over the hour. Speed is a crowd. Dust is a bot, so only
# the average trade size decides.
min_average_trade_usd = 15.0      # dust prints are spam, not demand
# A reused ticker is still blocked for the public recap unless strong KOL flow
# confirms it. Boosts are Dexscreener's advertising product: they are a caveat
# and a small score penalty, not a death sentence.
# Venues per chain. Empty, or a chain that is absent, means every venue there.
# Leave venues open. Strong runners often migrate or route through Raydium,
# Meteora or other Solana pools; the quality gate decides what is publishable.
venues = {}
min_holders = 1000                # a real distribution, not a handful of wallets
require_holder_count = true
min_trades_24h = 1000             # a real tape, not a dozen prints
# The insta-x-then-dead shape. An even day trades a quarter of its volume in the
# last six hours, so a few percent means the move finished hours ago.
min_recent_volume_share = 0.08
dead_check_above_multiple = 5.0
max_buy_ratio = 0.85              # a book with no sellers is manufactured
one_sided_min_trades = 300

# Disqualifying: a top 10 this large means the supply was never distributed.
bundle_top10_pct = 50.0
# GMGN launch-structure hard stops. Rug ratio alone is not a hard stop because
# established community coins can score high there; observed wash/bundle/
# insider/dev concentration is direct manipulation evidence.
gmgn_max_bundler_rate = 0.30
gmgn_max_insider_rate = 0.30
gmgn_max_dev_team_hold_rate = 0.15
# Not disqualifying, shown on the row.
caution_top10_pct = 25.0
thin_liquidity_ratio = 60.0
min_lore_group = 2
# Publisher-grade recap gate. This is stricter than the analyst screen because
# the public product should show organic runners only, not paid/adversarial flow.
exclude_boosted = false
require_socials = false
require_social_resolves = false
exclude_recycled = true
min_lp_locked_pct = 80.0
publisher_max_top10_pct = 25.0
min_symbol_length = 3
min_age_hours = 0.5
max_negative_1h_pct = 20.0
extreme_multiple = 10.0
extreme_min_volume_24h = 1000000.0
extreme_min_holders = 3000
extreme_min_turnover = 0.75
extreme_min_recent_volume_share = 0.15
strong_kol_wallets = 3
min_organic_confirmations = 6
organic_min_buy_ratio = 0.42
organic_max_buy_ratio = 0.72
blocked_symbol_terms = ["oil", "gas", "usa"]

# No quota fill: failed candidates remain in the private audit tape and never
# enter the client newsletter merely to reach a target count.
fill_with_caveated_runners = false
fill_min_runner_score = 25.0
fill_min_organic_score = 40.0
fill_max_manipulation = 55.0
fill_min_age_hours = 0.5
fill_hard_block_terms = [
  "rugcheck has already marked",
  "rugged",
  "scam",
  "honeypot",
  "mint authority still live",
  "freeze authority still live",
  "liquidity neither locked nor burned",
  "lp only 0%",
  "bundled supply",
  "same-funder holder cluster",
  "fresh-wallet holder pack",
  "effective top10 after clustering",
  "manufactured tape",
  "wash-trading shape",
  "market cap traded",
  "blacklist",
  "selling is penalised",
  "move with no linked social context",
  "move on only 0.",
  "of trades are buys",
  "no tracked kol wallet traded",
  "tracked kol wallet scan unavailable",
]

# Tracked wallets. `min_buyers_to_flag` independent buyers on one coin is the
# crowd-forming signal; realised SOL per mint is reconstructed from each
# wallet's own balance deltas.
[kol]
# GMGN is the broad KOL/smart-money provider. The legacy 125-wallet Helius
# reconstruction remains available for audits, but is disabled for daily runs;
# it is too slow and burns credits before finalist selection.
enabled = false
window_hours = 24
min_buyers_to_flag = 2
# Ignore unsolicited token dust. A wallet counts only when at least this much
# SOL actually moved through the trade.
min_trade_sol = 0.05
# Helius free tier answers a burst of heavy wallet-history calls with 429s, so
# this work is paced and budgeted separately from the holder snapshots.
# Full transaction details are limited to 100 rows per Helius page. The daily
# run follows paginationToken until the complete 24-hour range is exhausted.
transactions_page_size = 100
# Safety ceiling only. A wallet that exceeds it is marked incomplete and wholly
# excluded rather than silently using a partial history.
max_transaction_pages_per_wallet = 100
concurrency = 1
request_interval_seconds = 1.5
requests_per_minute = 18
cache_path = "data/kol-flow-cache.json"
cache_ttl_seconds = 21600
# 0 scans every wallet. Lower it if the Helius budget is tight; the list is
# ordered by reported PnL, so a partial scan keeps the strongest wallets.
max_wallets_per_run = 125
# KOL flow is a discovery source, not a pass. Mints found here are resolved via
# Dexscreener, then re-checked by the normal RugCheck/Helius/journal gates.
# 0 means enrich every KOL-touched mint through Dexscreener.
max_mints_enriched = 0
min_buyers_to_enrich = 1
min_participants_to_enrich = 2
min_realised_sol_to_enrich = 5.0
runner_lane_enabled = true
runner_lane_max = 12
runner_min_market_cap = 200000.0
runner_min_volume_24h = 100000.0
runner_max_age_hours = 24.0
runner_min_buyers = 2
runner_min_participants = 2
runner_min_realised_sol = 1.0
runner_min_sol_spent = 0.0
runner_require_positive_realised = true
runner_open_min_buyers = 5
runner_open_min_holders = 2
runner_allow_faded_below_floor = true
runner_max_manipulation = 75.0
runner_max_peak_turnover = 10.0
runner_require_safety = true
runner_require_holder_count = true
runner_min_holders = 300
ohlcv_requests_per_minute = 25
ohlcv_request_interval_seconds = 2.5


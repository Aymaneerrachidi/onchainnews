[delivery]
# The concise recap requires the full exact-contract preflight. The larger
# Discord filter universe uses the confirmed-danger gate: unknown metadata is
# disclosed, while measured rugs, honeypots, owner controls, top-10 above 30%,
# excessive dev ownership, wash trading and thin liquidity remain blocked.
require_preflight = true
preflight_min_exact_kol_trades = 1
preflight_block_any_security_flag = true
# Requires TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in .env.
# A missing credential warns and skips; it never fails the run.
telegram_enabled = true
html_enabled = true
# Morning message: the picks and one line each, not the full report.
telegram_digest = true
# Optional link appended to the digest so the full report is one tap away.
report_url = "https://onchainnews-rho.vercel.app"

# Discord uses DISCORD_BOT_TOKEN + DISCORD_CHANNEL_ID when configured so the
# same message can own the local Refresh live MC button. Otherwise it falls
# back to DISCORD_WEBHOOK_URL without a button; webhook secrets never enter
# the repo. Every embed is budgeted against Discord's shared character limits.
discord_enabled = true

# Optional email delivery. Use Brevo for API-based free delivery to external
# recipients without SMTP. Set BREVO_API_KEY in .env/GitHub secrets.
email_enabled = true
email_provider = "brevo"
email_from = "ue06prog@gmail.com"
email_from_name = "Fomo Onchain"
email_to = [
  "ue06prog@gmail.com",
]
email_subject_prefix = "Fomo Onchain"
# Newsletter recap breadth. Clean runners always appear. These settings add
# strong observed movers that did not clear the strict organic publisher gate,
# with their caveats shown inline, so the email reads like a real market recap.
# Kept for backward-compatible configuration parsing. The actual public cap is
# `[newsletter].max_coins`, shared by the writer, subject and HTML renderer.
newsletter_observed_limit = 30
newsletter_min_observed_runner_score = 25.0
newsletter_max_observed_manipulation = 70.0
newsletter_min_observed_volume = 250000.0
newsletter_min_observed_market_cap = 250000.0
newsletter_excluded_risk_terms = [
  "rugcheck has already marked",
  "rugged",
  "scam",
  "honeypot",
  "mint authority still live",
  "freeze authority still live",
  "liquidity neither locked nor burned",
  "bundled supply",
  "same-funder holder cluster",
  "fresh-wallet holder pack",
  "effective top10 after clustering",
  "manufactured tape",
  "blacklist",
  "selling is penalised",
  "recycled ticker/name",
  "move on only 0.",
  "move with no linked social context",
  "tracked-wallet confirmation was too thin",
  "no tracked kol wallet traded",
  "tracked kol wallet scan unavailable",
]

# The full daily runner index. Every entry crossed $250K inside the report
# window and passed the hard authority, LP, holder-distribution, liquidity,
# bundle, wash-trading and KOL checks. The first Discord message is a concise
# overview; its private filters browse this complete qualified set.
[journal]
enabled = true
# Human-confirmed bad mints never re-enter through the live screen, KOL lane,
# caveated fill, or saved intraday pulse history.
excluded_mints = [
  "n8MQ3kqhTjyiw4FCJ6kr93auxaBBZ43TkJMNKNnpump", # TNOS
  "DGX9HZznvcyiBAyVCPKZuof3Qb7XayvWgMMJbJJhpump", # KERMIT
  "0xb166e8b140d35d9d8226e40c09f757bac5a4d87d", # NPC
  "739dnZEG4yaBWFsY8L8ZwrfhGG6dhtCSercW8Umspump", # CLAW
  "0x8226dda5f73619dedc671e09be738fa308da1944", # HEDGE
  "0x777777780838c00038ecd48f63f3c37669322bc8", # ETHCAT
  "6yjNqPzTSanBWSa6dxVEgTjePXBrZ2FoHLDQwYwEsyM6", # CHUD
  "0xb0f09ea9ae0515c3551080d4a745c8115aa30e37", # DOS: received-token flow, no confirmed KOL buys
]
# Exact operator-reviewed exceptions for providers that do not expose holder
# structure on the asset. They bypass missing holder/top-10 data only; every
# other confirmed-danger and liquidity check still applies.
holder_structure_exception_mints = [
  "0x02fca66c1d1afb4e2a7884261eb00f63598a7436", # NVDAB
  "0xcaae2a2f939f51d97cdfa9a86e79e3f085b799f3", # TUT
]
# Public overview cap only. The full qualified universe is never truncated.
max_runners = 20
# The day's biggest markets, chosen on volume rather than on the size of the move.
headline_tape_size = 5
# The tape reports what the market bought. A big coin that spent the day
# falling is a different story and does not open the recap.
headline_tape_min_change_pct = 40.0
headline_tape_max_age_hours = 720.0
headline_tape_min_volume = 500000.0
# Never manufacture a daily quota. Publish every organic runner that clears the
# evidence gate; a quiet day may contain fewer names and a busy day may contain
# many more.
target_min_runners = 0
include_intraday_pulse_runners = true
# The recap is the ledger of hourly alerts: include every pulse runner that was
# actually claimed for delivery in the preceding 24 hours, even if it faded or
# the deeper morning KOL scan did not rediscover it. New hard-risk evidence can
# still remove it.
pulse_recap_alerted_only = true
include_all_alerted_pulse_runners = true
intraday_min_peak_market_cap = 250000.0
intraday_min_volume_24h = 250000.0
intraday_min_liquidity = 40000.0
intraday_min_trades_24h = 1000
intraday_min_change_24h_pct = 50.0
intraday_min_runner_score = 25.0
intraday_max_manipulation = 55.0
min_volume_24h = 250000.0
min_liquidity = 40000.0
# Peak-led recap: an established token may belong if it made a measured move in
# this 24h window. GMGN lifetime ATH is only trusted for <=24h-old launches.
max_age_hours = 0
peak_market_cap_floor = 250000.0
min_window_multiple = 1.50
# The daily public board is launch-first: a coin is new only during its first
# 24 hours. Anything older must prove an exceptional trailing-day move.
fresh_window_hours = 24
min_fresh_change_pct = 30.0
# An established coin belongs only when candles or the hourly tape prove a
# +50% move inside this report window. A lifetime ATH or large cap is not proof.
# Zero delegates the threshold to min_daily_change_pct below.
older_than_a_day_multiple = 0.0
# A runner may round-trip before the morning report. Preserve the verified peak
# and disclose the drawdown instead of deleting what happened.
older_min_live_change_pct = 0.0
min_daily_change_pct = 50.0
# The broad journal also starts the established-coin gate after 24 hours.
old_coin_age_hours = 24.0
old_coin_micro_cap_ceiling = 500000.0
old_coin_low_cap_ceiling = 1000000.0
old_coin_small_cap_ceiling = 10000000.0
old_coin_large_cap_floor = 20000000.0
old_coin_micro_min_change_pct = 150.0
old_coin_low_min_change_pct = 100.0
old_coin_small_min_change_pct = 75.0
old_coin_mid_min_change_pct = 50.0
old_coin_large_min_change_pct = 30.0
old_coin_allow_aggregate_change_with_kline = true
runner_universe_min_runner_score = 40.0
# Final publication is smaller and Solana-led. Other chains must make a much
# stronger move to use one of the four non-Solana slots.
publication_fresh_hours = 24.0
publication_max_coins = 20
publication_standard_coins = 15
publication_overflow_min_multiple = 5.0
publication_max_non_solana = 4
publication_max_top10_pct = 30.0
publication_min_holders = 1000
publication_min_solana_kols = 1
publication_min_other_kols = 5
publication_min_other_liquidity = 100000.0
publication_other_max_drawdown_pct = 80.0
publication_other_max_entrapment_ratio = 0.50
# Entrapment above 50% may be a provider false positive in a mature, broadly
# traded market. Override that warning only when every independent organic
# signal below is present. This never overrides honeypot, rug, authority,
# wash-trading or bundle failures.
publication_entrapment_override_enabled = true
publication_entrapment_override_min_liquidity = 250000.0
publication_entrapment_override_min_volume_24h = 1000000.0
publication_entrapment_override_min_holders = 5000
publication_entrapment_override_max_top10_pct = 20.0
publication_entrapment_override_min_kols = 10
publication_solana_old_small_move_pct = 75.0
publication_solana_old_mid_move_pct = 50.0
publication_solana_old_large_move_pct = 30.0
publication_other_old_small_move_pct = 300.0
publication_other_old_mid_move_pct = 150.0
# Large-cap moves are market-wide tape events. Keep the same +30% rule used by
# the broad journal; contract, KOL, liquidity and entrapment gates still apply.
publication_other_old_large_move_pct = 30.0
# An ATH alone is not a fresh event for an established coin; its trailing-day
# candles must also clear the size-adjusted move above.
allow_old_new_ath_exception = false
new_ath_tolerance_pct = 2.0
min_new_ath_move_pct = 10.0
# Above this multiple, expect at least one tracked wallet to have been in it.
# Measured on live data, 66 wallets touch only about one runner in seven, so
# silence is the norm and flagging it at 5x accused nearly every coin. Set where
# absence is genuinely odd, and reported on the row rather than treated as proof.
# Lower this as more wallets are added and coverage improves.
expect_tracked_wallets_above = 10.0
# Tracked wallets are confirmation, not a hard gate. A real organic runner can
# be missed by our wallet set; absence should be reported/weighted, not used to
# zero the newsletter.
require_wallet_touch_for_publish = false
# Our tracked-wallet coverage is a Solana list. On Solana a runner nobody we
# follow touched is genuinely suspicious; off Solana that silence only measures
# who we follow, so the requirement is scoped to the chain it means something on.
require_kol_trade_for_publish = true
# Empty means every supported chain. A runner is never published merely because
# our wallet coverage was weaker on its chain.
require_kol_trade_chains = []
min_kol_trades_for_publish = 1
gate_editorial_tracks = true
wallet_touch_required_above_multiple = 1.8
wallet_touch_required_min_mcap = 200000.0
wallet_touch_required_min_buyers = 2
wallet_touch_required_min_participants = 3
wallet_touch_required_min_realised_sol = 50.0
# A feed sometimes reports a nonsense 24h change when a pool is reseeded. Such
# a number tops every ranking, so a big run must be corroborated by turnover.
max_credible_multiple = 1000.0
corroborate_above_multiple = 10.0
min_turnover_for_big_run = 0.15

# Organic-market gate. A coin can be perfectly safe to hold and still be a bot
# trading with itself, a bought trend slot, or the ninth mint wearing a ticker
# that worked once. These remove it from the record rather than label it.
max_volume_liquidity = 75.0       # 24h volume against pool depth
# Floors below were calibrated on established coins. A launch is judged on the
# same evidence at the level it can actually have reached by its first day;
# `fresh_gate_hours` decides which set applies.
fresh_gate_hours = 36.0
fresh_max_volume_liquidity = 250.0
fresh_min_holders = 300
fresh_min_trades_24h = 400
fresh_publisher_max_top10_pct = 30.0
# A measurement we could not take is not a failure. Reported on the row instead.
block_on_missing_safety_data = true
# Pool depth is not comparable across chains: a BNB or Base runner works a much
# smaller pool than a Solana one at the same market cap.
min_liquidity_by_chain = { solana = 40000.0, bsc = 30000.0, base = 30000.0, ethereum = 50000.0, robinhood = 30000.0 }
max_turnover = 30.0               # 24h volume against market cap
# Cadence was measured against a coin the client confirmed was normal: it ran
# 219 trades a minute over the hour. Speed is a crowd. Dust is a bot, so only
# the average trade size decides.
min_average_trade_usd = 15.0      # dust prints are spam, not demand
# A reused ticker is still blocked for the public recap unless strong KOL flow
# confirms it. Boosts are Dexscreener's advertising product: they are a caveat
# and a small score penalty, not a death sentence.
# Venues per chain. Empty, or a chain that is absent, means every venue there.
# Leave venues open. Strong runners often migrate or route through Raydium,
# Meteora or other Solana pools; the quality gate decides what is publishable.
venues = {}
min_holders = 1000                # a real distribution, not a handful of wallets
require_holder_count = true
min_trades_24h = 1000             # a real tape, not a dozen prints
# The insta-x-then-dead shape. An even day trades a quarter of its volume in the
# last six hours, so a few percent means the move finished hours ago.
min_recent_volume_share = 0.0
dead_check_above_multiple = 5.0
max_buy_ratio = 0.85              # a book with no sellers is manufactured
one_sided_min_trades = 300

# Disqualifying: a top 10 this large means the supply was never distributed.

max_total_fee_pct = 3.0
# Only GMGN's explicit buy_tax/sell_tax fields are contract taxes. total_fee and
# trade_fee are market-activity fields and must never disqualify a token.
fee_check_chains = ["bsc", "base", "ethereum", "robinhood"]
# A cap the pool cannot support. Impostor clones of a running coin arrive
# claiming hundreds of millions off a few thousand dollars of liquidity.
max_market_cap_liquidity = 200.0
# A large cap with no trade behind it is the same fiction seen from the other
# side: $108M of "market cap" on $536k of daily volume.
phantom_cap_above = 5000000.0
phantom_min_turnover = 0.05
# GMGN launch-structure hard stops. Rug ratio alone is not a hard stop because
# established community coins can score high there; observed wash/bundle/
# insider/dev concentration is direct manipulation evidence.
gmgn_max_bundler_rate = 0.30
gmgn_max_insider_rate = 0.30
gmgn_max_dev_team_hold_rate = 0.15
# Launch bundles remain a hard stop until the market itself proves dispersion.
# This lets an established, widely distributed coin through without forgiving
# wash trading, insider control, dev concentration, live authorities, or rugs.
allow_redistributed_launch_bundles = true
bundle_redistribution_min_age_hours = 72.0
bundle_redistribution_min_holders = 5000
bundle_redistribution_max_top10_pct = 20.0
bundle_redistribution_min_lp_pct = 90.0
bundle_redistribution_min_kol = 5
bundle_redistribution_max_insider_rate = 0.05
bundle_redistribution_max_dev_rate = 0.05
bundle_redistribution_min_liquidity = 100000.0
bundle_redistribution_min_volume_24h = 1000000.0
# Not disqualifying, shown on the row.
caution_top10_pct = 25.0
# A transfer tax at or above this is shown on the row; at or above
# `max_total_fee_pct` the coin is removed outright. A holder who has to pay to
# leave is in the same position as one facing a soft rug, so a taxed token has
# no place in a recap of coins worth watching.
caution_total_fee_pct = 1.0
thin_liquidity_ratio = 60.0
min_lore_group = 2

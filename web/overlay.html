<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Onchain News — Stream Overlay</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,700&display=swap" rel="stylesheet">
<style>
/*
  OBS Browser Source overlay, in fomo's brand.

  Colours and type come from the fomo brand guidelines: primary blue #516AF6,
  secondary blue #4A36FF, navy #221D4B, white #EAEDFF, and Aeonik as the only
  typeface (Regular for body, Medium for subheads, Bold for headlines).

  Aeonik is a licensed CoType face and is not redistributed here, so it is
  listed first and picked up automatically once installed on the machine that
  renders the overlay. Switzer is the closest freely licensed stand-in until
  then, and a geometric system stack catches the rest.

  Panels are navy with white type, which is the brand's own "white on dark"
  pairing and the only combination that stays legible over an arbitrary scene.

  Everything is sized from one --u variable tied to viewport width, so a single
  build reads correctly at 1080p, 1440p or a cropped source.

  The page background stays transparent: OBS composites this over the scene, and
  any opaque colour here would black out the stream.
*/
:root{
  --u:calc(100vw / 1920);          /* one design pixel at any canvas width */

  /* fomo brand colours, verbatim from the guidelines */
  --blue:#516AF6;                  /* primary blue */
  --blue-2:#4A36FF;                /* secondary blue */
  --navy:#221D4B;                  /* navy */
  --white:#EAEDFF;                 /* white */

  /* Derived working tones. Every runner is up on the day, so the multiple never
     needs a "gain" colour; only the one-hour delta can go negative, and the
     alert red is the same vivid tone the guidelines use to mark misuse. */
  --panel:var(--navy);
  --panel-2:#2C2760;
  --line:rgba(234,237,255,.16);
  --muted:#9C9BC4;
  --alert:#FF4A2E;

  --font:"Aeonik","Switzer","Aeonik Pro",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  --radius:calc(20*var(--u));
  --shadow:0 calc(10*var(--u)) calc(34*var(--u)) rgba(15,12,45,.42);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:transparent;overflow:hidden}
body{font-family:var(--font);color:var(--white);font-variant-numeric:tabular-nums;
  font-weight:400;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
#stage{position:fixed;inset:0}
[hidden]{display:none!important}
.up{color:var(--white)}
.dn{color:var(--alert)}

/* ============================ TICKER ============================ */
.ticker{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:stretch;
  height:calc(78*var(--u));background:var(--navy);box-shadow:var(--shadow);overflow:hidden}
.ticker .brand{display:flex;align-items:center;gap:calc(11*var(--u));flex:none;
  background:var(--blue);color:var(--white);padding:0 calc(26*var(--u));
  font-size:calc(25*var(--u));font-weight:700;text-transform:lowercase;letter-spacing:-.02em}
.ticker .brand small{font-size:calc(12*var(--u));font-weight:500;opacity:.8;
  letter-spacing:.14em;text-transform:uppercase}
.ticker .vp{flex:1;overflow:hidden;display:flex;align-items:center}
.ticker .track{display:flex;gap:calc(48*var(--u));width:max-content;
  animation:march var(--speed,60s) linear infinite;padding-left:calc(32*var(--u))}
@keyframes march{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk-item{display:flex;align-items:baseline;gap:calc(11*var(--u));white-space:nowrap}
.tk-item b{font-size:calc(23*var(--u));font-weight:700}
.tk-item .mult{font-size:calc(23*var(--u));font-weight:700;color:var(--white)}
.tk-item .mc{font-size:calc(16*var(--u));font-weight:400;color:var(--muted)}
.tk-item .flag{font-size:calc(12*var(--u));font-weight:500;letter-spacing:.1em;
  text-transform:uppercase;color:var(--white);background:var(--blue-2);
  padding:calc(2*var(--u)) calc(8*var(--u));border-radius:calc(6*var(--u))}

/* ============================ CARD ============================ */
.card{position:absolute;right:calc(56*var(--u));top:calc(120*var(--u));
  width:calc(560*var(--u));background:var(--panel);box-shadow:var(--shadow);
  border-radius:var(--radius);overflow:hidden}
/* Scene presets: his camera scene puts him centre-right, the trading terminal
   fills the middle, so the panel has to be able to sit in any corner. */
.at-tl{top:calc(60*var(--u))!important;bottom:auto!important;left:calc(48*var(--u))!important;right:auto!important}
.at-tr{top:calc(60*var(--u))!important;bottom:auto!important;right:calc(48*var(--u))!important;left:auto!important}
.at-bl{bottom:calc(110*var(--u))!important;top:auto!important;left:calc(48*var(--u))!important;right:auto!important}
.at-br{bottom:calc(110*var(--u))!important;top:auto!important;right:calc(48*var(--u))!important;left:auto!important}
.card .top{display:flex;justify-content:space-between;align-items:center;
  background:var(--blue);padding:calc(13*var(--u)) calc(20*var(--u))}
.card .top span{font-size:calc(13*var(--u));font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(234,237,255,.82)}
.card .top b{font-size:calc(20*var(--u));font-weight:700;text-transform:lowercase;letter-spacing:-.02em}
.card .id{display:flex;justify-content:space-between;align-items:flex-end;gap:calc(20*var(--u));
  padding:calc(20*var(--u));border-bottom:calc(1*var(--u)) solid var(--line)}
.card .id>div:first-child{min-width:0}
.card .sym{font-size:calc(56*var(--u));font-weight:700;line-height:.95;letter-spacing:-.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sym.long{font-size:calc(40*var(--u))}
.card .sym.xlong{font-size:calc(31*var(--u))}
.card .nm{font-size:calc(16*var(--u));font-weight:400;color:var(--muted);margin-top:calc(6*var(--u));
  max-width:calc(300*var(--u));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .mult{font-size:calc(54*var(--u));font-weight:700;line-height:.95;text-align:right;
  flex:none;white-space:nowrap;letter-spacing:-.03em}
.card .mult small{display:block;font-size:calc(13*var(--u));font-weight:500;letter-spacing:.16em;
  color:var(--muted);margin-top:calc(7*var(--u))}
.grid{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:calc(1*var(--u)) solid var(--line)}
.grid div{padding:calc(13*var(--u)) calc(12*var(--u));border-right:calc(1*var(--u)) solid var(--line)}
.grid div:last-child{border-right:0}
.grid span{display:block;font-size:calc(11*var(--u));font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin-bottom:calc(6*var(--u))}
.grid b{font-size:calc(22*var(--u));font-weight:700}
.ca{display:flex;gap:calc(16*var(--u));padding:calc(18*var(--u)) calc(20*var(--u));align-items:center}
.ca .qr{flex:none;background:var(--white);padding:calc(9*var(--u));line-height:0;
  border-radius:calc(10*var(--u))}
.ca .qr svg{display:block;width:calc(130*var(--u));height:calc(130*var(--u));shape-rendering:crispEdges}
.ca .txt{min-width:0;flex:1}
.ca .txt span{display:block;font-size:calc(11*var(--u));font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin-bottom:calc(7*var(--u))}
.ca .addr{font-size:calc(17*var(--u));font-weight:500;word-break:break-all;line-height:1.4}
.ca .scan{margin-top:calc(10*var(--u));font-size:calc(13*var(--u));font-weight:700;color:var(--blue)}
.flags{border-top:calc(1*var(--u)) solid var(--line);padding:calc(14*var(--u)) calc(20*var(--u));
  display:flex;flex-wrap:wrap;gap:calc(8*var(--u))}
.flags .f{font-size:calc(13*var(--u));font-weight:500;color:var(--white);
  background:rgba(255,74,46,.16);border:calc(1*var(--u)) solid var(--alert);
  padding:calc(4*var(--u)) calc(10*var(--u));border-radius:calc(8*var(--u))}
.flags .ok{background:rgba(81,106,246,.18);border-color:var(--blue);color:var(--white)}
.kol{background:var(--blue-2);padding:calc(12*var(--u)) calc(20*var(--u));
  font-size:calc(14*var(--u));display:flex;gap:calc(10*var(--u));align-items:baseline}
.kol b{font-weight:700;background:var(--white);color:var(--blue-2);
  padding:calc(1*var(--u)) calc(8*var(--u));border-radius:calc(6*var(--u));font-size:calc(13*var(--u))}
.kol i{font-style:normal;color:rgba(234,237,255,.85);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}

/* ============================ LOWER THIRD ============================ */
.l3{position:absolute;left:calc(56*var(--u));bottom:calc(110*var(--u));
  display:flex;align-items:stretch;box-shadow:var(--shadow);max-width:calc(1180*var(--u));
  border-radius:var(--radius);overflow:hidden}
.l3 .mark{background:var(--blue);white-space:nowrap;font-size:calc(24*var(--u));font-weight:700;
  display:flex;align-items:center;padding:0 calc(22*var(--u));letter-spacing:-.01em}
.l3 .body{background:var(--panel);padding:calc(14*var(--u)) calc(22*var(--u));
  display:flex;align-items:center;gap:calc(24*var(--u))}
.l3 .sym{font-size:calc(38*var(--u));font-weight:700;line-height:1;letter-spacing:-.02em}
.l3 .mult{font-size:calc(34*var(--u));font-weight:700;line-height:1;letter-spacing:-.02em}
.l3 .kv{display:flex;flex-direction:column}
.l3 .kv span{font-size:calc(11*var(--u));font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
.l3 .kv b{font-size:calc(21*var(--u));font-weight:700;white-space:nowrap}
.l3 .qr{background:var(--white);padding:calc(7*var(--u));line-height:0;border-radius:calc(8*var(--u))}
.l3 .qr svg{display:block;width:calc(84*var(--u));height:calc(84*var(--u));shape-rendering:crispEdges}
.l3 .warn{font-size:calc(13*var(--u));font-weight:500;color:var(--alert);
  max-width:calc(210*var(--u));line-height:1.35}

/* ============================ BOARD ============================ */
.board{position:absolute;right:calc(48*var(--u));top:calc(70*var(--u));
  width:calc(600*var(--u));background:var(--panel);box-shadow:var(--shadow);
  border-radius:var(--radius);overflow:hidden}
.board .bh{background:var(--blue);padding:calc(15*var(--u)) calc(20*var(--u));
  display:flex;justify-content:space-between;align-items:baseline}
.board .bh b{font-size:calc(25*var(--u));font-weight:700;letter-spacing:-.02em}
.board .bh span{font-size:calc(12*var(--u));font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(234,237,255,.82)}
.board ol{list-style:none}
.board li{display:grid;grid-template-columns:calc(34*var(--u)) 1fr auto auto;
  gap:calc(14*var(--u));align-items:baseline;padding:calc(12*var(--u)) calc(20*var(--u));
  border-bottom:calc(1*var(--u)) solid var(--line)}
.board li:last-child{border-bottom:0}
.board .n{font-size:calc(15*var(--u));font-weight:700;color:var(--blue)}
.board .s{font-size:calc(22*var(--u));font-weight:700;letter-spacing:-.02em}
.board .s em{display:block;font-style:normal;font-size:calc(12*var(--u));
  font-weight:400;color:var(--muted)}
.board .m{font-size:calc(24*var(--u));font-weight:700;letter-spacing:-.02em}
.board .c{font-size:calc(16*var(--u));font-weight:500;min-width:calc(76*var(--u));text-align:right}
.board .kolc{background:var(--blue-2);color:var(--white);font-size:calc(12*var(--u));
  font-weight:700;padding:calc(3*var(--u)) calc(8*var(--u));border-radius:calc(6*var(--u));
  white-space:nowrap}

/* ============================ SHARED ============================ */
.marks{display:flex;flex-direction:column;align-items:flex-end;gap:calc(5*var(--u))}
.stamp{font-size:calc(12*var(--u));font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--white);background:var(--alert);padding:calc(3*var(--u)) calc(9*var(--u));
  border-radius:calc(6*var(--u));white-space:nowrap}
.card .top .stamp{background:rgba(255,255,255,.18)}
.enter{animation:pop .42s cubic-bezier(.16,1,.3,1) both}
@keyframes pop{from{opacity:0;transform:translateY(calc(16*var(--u))) scale(.99)}to{opacity:1;transform:none}}
.live{display:inline-block;width:calc(9*var(--u));height:calc(9*var(--u));border-radius:50%;
  background:var(--white);animation:blink 2s infinite;vertical-align:middle}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="stage"></div>

<script>
"use strict";
/* --------------------------------------------------------------------------
   Config comes from the URL so OBS scene switching is the control surface.
   No backend, no companion app: each scene is a Browser Source with its own
   query string, and showing/hiding the source is what changes the overlay.

     ?mode=ticker | card | lower3 | board
     &coin=BOT            pin one coin by symbol (default: the top runner)
     &rotate=8            seconds per coin; omit to stay on one
     &max=8               rows on the board
     &refresh=30          seconds between live price refreshes
     &side=left|right     which side the card/board sits on
     &at=tl|tr|bl|br      corner for the card/board, overrides side
     &nocontrol=1         ignore the OBS control dock for this source

   The control dock (control.html) drives which coin is on screen and whether
   anything shows at all. Docks and browser sources share one origin inside OBS,
   so localStorage carries the state between them with no server involved. Each
   source keeps its own mode from its own URL, so the dock never fights a scene.
-------------------------------------------------------------------------- */
const P = new URLSearchParams(location.search);
const MODE = (P.get("mode") || "ticker").toLowerCase();
const PIN = (P.get("coin") || "").replace(/^\$/, "").toUpperCase();
const ROTATE = Math.max(0, parseFloat(P.get("rotate") || "0")) * 1000;
const MAX = parseInt(P.get("max") || "8", 10);
const REFRESH = Math.max(10, parseFloat(P.get("refresh") || "30")) * 1000;
const SIDE = (P.get("side") || "right").toLowerCase();
const AT = (P.get("at") || "").toLowerCase();
const NOCONTROL = P.get("nocontrol") === "1";
const STATE_KEY = "onchain-overlay-state";
const stage = document.getElementById("stage");

let RUNNERS = [];
let idx = 0;
// Set by the control dock: which coin he wants up, and whether to show anything.
let control = { coin: null, visible: true, rotate: 0 };
let rotateTimer = null;

/* ---------- formatting ---------- */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n) => {
  if (n == null || !isFinite(n)) return "—";
  const a = Math.abs(n);
  if (a >= 1e9) return "$" + (n / 1e9).toFixed(1) + "B";
  if (a >= 1e6) return "$" + (n / 1e6).toFixed(1) + "M";
  if (a >= 1e3) return "$" + Math.round(n / 1e3) + "k";
  return "$" + Math.round(n);
};
const pct = (n) => n == null || !isFinite(n) ? "—" : (n >= 0 ? "+" : "") + Math.round(n) + "%";
const mult = (r) => r.runMultiple >= 2 ? r.runMultiple.toFixed(1) + "x" : pct(r.change24h);
const ageOf = (h) => h == null ? "—" : h < 48 ? Math.round(h) + "h" : Math.round(h / 24) + "d";
const shortCa = (m) => m.length > 16 ? m.slice(0, 8) + "…" + m.slice(-6) : m;

/* A QR arrives as rows of "0"/"1"; drawing it as one path keeps the SVG small
   and the edges hard, which matters after stream compression. */
function qrSvg(matrix) {
  if (!matrix || !matrix.length) return "";
  const n = matrix.length, q = 2, size = n + q * 2;
  let d = "";
  for (let y = 0; y < n; y++) {
    const row = matrix[y];
    for (let x = 0; x < n; x++) {
      if (row[x] === "1") d += `M${x + q} ${y + q}h1v1h-1z`;
    }
  }
  return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
    <rect width="${size}" height="${size}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

/* The single most useful thing to say about a coin in one glance. */
function topFlag(r) {
  if (r.faded != null) return "FADING";
  if ((r.riskLabels || []).some((f) => /bundle|concentr|top 10/i.test(f))) return "CONCENTRATED";
  if ((r.riskLabels || []).some((f) => /thin pool/i.test(f))) return "THIN LIQUIDITY";
  if ((r.riskLabels || []).some((f) => /reused/i.test(f))) return "RECYCLED TICKER";
  if ((r.kolBuyers || []).length >= 2) return "KOL CROWD";
  if ((r.riskLabels || []).some((f) => /tracked wallet touched/i.test(f))) return "NO SMART MONEY";
  return "";
}

/* ---------- renderers ---------- */
function ticker(list) {
  const items = list.map((r) => {
    const f = topFlag(r);
    return `<span class="tk-item"><b>$${esc(r.symbol)}</b>
      <em class="mult ${r.change24h >= 0 ? "up" : "dn"}">${mult(r)}</em>
      <em class="mc">${money(r.marketCap)}</em>
      ${f ? `<em class="flag">${f}</em>` : ""}</span>`;
  }).join("");
  const speed = Math.max(30, list.length * 6);
  return `<div class="ticker enter">
    <div class="brand">fomo <small>ran today</small></div>
    <div class="vp"><div class="track" style="--speed:${speed}s">${items}${items}</div></div>
  </div>`;
}

function card(r) {
  const flags = (r.riskLabels || []).slice(0, 4)
    .map((f) => `<span class="f">${esc(f)}</span>`).join("")
    || `<span class="f ok">No flags raised</span>`;
  const st = topFlag(r);
  const kol = (r.kolBuyers || []).length
    ? `<div class="kol"><b>${r.kolBuyers.length} KOL</b>
        <i>${esc(r.kolBuyers.slice(0, 4).join(", "))}${r.kolBuyers.length > 4 ? " +" + (r.kolBuyers.length - 4) : ""}</i></div>`
    : "";
  const pos = SIDE === "left"
    ? `left:calc(56*var(--u));right:auto` : `right:calc(56*var(--u));left:auto`;
  return `<div class="card enter ${AT ? "at-" + AT : ""}" style="${pos}">
    <div class="top">${st ? `<span class="stamp">${st}</span>` : `<span>Ran today</span>`}<b>fomo</b></div>
    <div class="id">
      <div><div class="sym ${r.symbol.length > 11 ? "xlong" : r.symbol.length > 7 ? "long" : ""}">$${esc(r.symbol)}</div><div class="nm">${esc(r.name)}</div></div>
      <div class="mult ${r.change24h >= 0 ? "up" : "dn"}">${mult(r)}<small>24 HOURS</small></div>
    </div>
    <div class="grid">
      <div><span>Mcap</span><b>${money(r.marketCap)}</b></div>
      <div><span>1h</span><b class="${r.change1h >= 0 ? "up" : "dn"}">${pct(r.change1h)}</b></div>
      <div><span>Liq</span><b>${money(r.liquidity)}</b></div>
      <div><span>Holders</span><b>${r.holders ? r.holders.toLocaleString() : "—"}</b></div>
      <div><span>Age</span><b>${ageOf(r.ageHours)}</b></div>
    </div>
    <div class="ca">
      ${r.qr && r.qr.length ? `<div class="qr">${qrSvg(r.qr)}</div>` : ""}
      <div class="txt">
        <span>Contract</span>
        <div class="addr">${esc(r.mint)}</div>
        ${r.qr && r.qr.length ? `<div class="scan">Scan to open the coin</div>` : ""}
      </div>
    </div>
    <div class="flags">${flags}</div>
    ${kol}
  </div>`;
}

function lower3(r) {
  const warn = (r.riskLabels || [])[0] || "";
  return `<div class="l3 enter">
    <div class="mark">ran today</div>
    <div class="body">
      <div class="sym">$${esc(r.symbol)}</div>
      <div class="mult ${r.change24h >= 0 ? "up" : "dn"}">${mult(r)}</div>
      <div class="kv"><span>Mcap</span><b>${money(r.marketCap)}</b></div>
      <div class="kv"><span>1h</span><b class="${r.change1h >= 0 ? "up" : "dn"}">${pct(r.change1h)}</b></div>
      <div class="kv"><span>Contract</span><b>${esc(shortCa(r.mint))}</b></div>
      ${warn ? `<div class="warn">${esc(warn)}</div>` : ""}
      ${r.qr && r.qr.length ? `<div class="qr">${qrSvg(r.qr)}</div>` : ""}
    </div>
  </div>`;
}

function board(list) {
  const rows = list.slice(0, MAX).map((r, i) => {
    const n = (r.kolBuyers || []).length;
    return `
    <li><span class="n">${String(i + 1).padStart(2, "0")}</span>
      <span class="s">$${esc(r.symbol)}<em>${esc(r.name)}</em></span>
      <span class="m ${r.change24h >= 0 ? "up" : "dn"}">${mult(r)}</span>
      <span class="c">${n ? `<b class="kolc">${n} KOL</b>` : money(r.marketCap)}</span></li>`;
  }).join("");
  const pos = SIDE === "left"
    ? `left:calc(48*var(--u));right:auto` : `right:calc(48*var(--u));left:auto`;
  return `<div class="board enter ${AT ? "at-" + AT : ""}" style="${pos}">
    <div class="bh"><b>ran today</b><span><i class="live"></i> ${list.length} COINS</span></div>
    <ol>${rows}</ol>
  </div>`;
}

/* ---------- paint ---------- */
function pick() {
  if (!RUNNERS.length) return null;
  // The dock wins over the URL: the URL sets the scene up, he steers it live.
  const wanted = control.coin || PIN;
  if (wanted) {
    const hit = RUNNERS.find((r) => r.symbol.toUpperCase() === String(wanted).toUpperCase());
    if (hit) return hit;
  }
  return RUNNERS[idx % RUNNERS.length];
}

function paint() {
  if (!RUNNERS.length || !control.visible) { stage.innerHTML = ""; return; }
  const one = pick();
  if (MODE === "ticker") stage.innerHTML = ticker(RUNNERS);
  else if (MODE === "board") stage.innerHTML = board(RUNNERS);
  else if (MODE === "lower3") stage.innerHTML = lower3(one);
  else stage.innerHTML = card(one);
}

/* ---------- data ---------- */
async function loadSnapshot() {
  try {
    const res = await fetch("data/latest.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error(String(res.status));
    const data = await res.json();
    const by = (P.get("sort") || "run").toLowerCase();
    RUNNERS = (data.runners || []).slice().sort((a, b) =>
      by === "kol"
        ? (b.kolBuyers || []).length - (a.kolBuyers || []).length || b.runMultiple - a.runMultiple
        : b.runMultiple - a.runMultiple);
    paint();
  } catch (err) {
    // A failed refresh must never blank an overlay that is already on air.
    if (!RUNNERS.length) stage.innerHTML = "";
  }
}

/* The heavy pipeline runs once a day; prices would be stale on camera by
   evening. Dexscreener is free and CORS-open, so the overlay refreshes just
   the numbers for the coins it is showing, leaving safety, KOL and lore from
   the morning run. */
async function refreshPrices() {
  if (!RUNNERS.length) return;
  const wanted = (MODE === "ticker" || MODE === "board")
    ? RUNNERS.slice(0, 25) : [pick()].filter(Boolean);
  const mints = [...new Set(wanted.map((r) => r.mint))].slice(0, 30);
  if (!mints.length) return;
  try {
    const res = await fetch("https://api.dexscreener.com/tokens/v1/solana/" + mints.join(","),
      { cache: "no-store" });
    if (!res.ok) return;
    const pairs = await res.json();
    const best = new Map();
    for (const p of Array.isArray(pairs) ? pairs : []) {
      const mint = p?.baseToken?.address;
      if (!mint) continue;
      const liq = p?.liquidity?.usd || 0;
      if (!best.has(mint) || liq > best.get(mint).liq) best.set(mint, { p, liq });
    }
    let changed = false;
    for (const r of RUNNERS) {
      const hit = best.get(r.mint);
      if (!hit) continue;
      const p = hit.p;
      const mc = Number(p.marketCap) || r.marketCap;
      const c24 = Number(p?.priceChange?.h24);
      const c1 = Number(p?.priceChange?.h1);
      if (isFinite(mc)) r.marketCap = mc;
      if (isFinite(c24)) { r.change24h = c24; r.runMultiple = 1 + c24 / 100; }
      if (isFinite(c1)) r.change1h = c1;
      if (Number(p?.liquidity?.usd)) r.liquidity = Number(p.liquidity.usd);
      changed = true;
    }
    if (changed) paint();
  } catch { /* keep the last good numbers on screen */ }
}

/* The control dock writes to localStorage from another OBS browser context.
   Storage events are not delivered everywhere OBS runs these, so the state is
   also polled: twice a second is imperceptible and never misses a click. */
function applyControl(next) {
  if (!next || NOCONTROL) return;
  const changed =
    next.coin !== control.coin ||
    next.visible !== control.visible ||
    next.rotate !== control.rotate;
  control = { coin: next.coin ?? null, visible: next.visible !== false, rotate: next.rotate || 0 };
  if (!changed) return;
  setRotation(control.rotate ? control.rotate * 1000 : ROTATE);
  paint();
}

function readControl() {
  if (NOCONTROL) return;
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (raw) applyControl(JSON.parse(raw));
  } catch { /* no dock in this context */ }
}

function setRotation(ms) {
  if (rotateTimer) clearInterval(rotateTimer);
  rotateTimer = null;
  if (ms > 0) rotateTimer = setInterval(() => { idx++; paint(); }, ms);
}

try {
  new BroadcastChannel(STATE_KEY).onmessage = (event) => applyControl(event.data);
} catch { /* older runtime; the poll below covers it */ }
window.addEventListener("storage", (event) => {
  if (event.key === STATE_KEY && event.newValue) {
    try { applyControl(JSON.parse(event.newValue)); } catch {}
  }
});

readControl();
loadSnapshot();
setRotation(ROTATE);
setInterval(readControl, 500);                // dock state
setInterval(loadSnapshot, 10 * 60 * 1000);    // new daily snapshot, if published
setInterval(refreshPrices, REFRESH);          // live prices during the stream
</script>
</body>
</html>
